# JUnit 5 Configuration
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer\$OrderAnnotation
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator\$Simple
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.config.fixed.maxparallel = 2

# Test engine
junit.platform.engine = junit-jupiter

# Disable default tests
junit.jupiter.tests.all.enabled = true
